name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "${UNFORMATTED}" ]; then
            echo "gofmt needed on:" && echo "${UNFORMATTED}" && exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Shell syntax
        run: for script in deploy/*.sh; do bash -n "$script"; done
